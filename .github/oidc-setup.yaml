AWSTemplateFormatVersion: '2010-09-09'
Description: 'GitHub OIDC Provider and IAM Role for GitHub Actions CI/CD'

Parameters:
  GitHubOrg:
    Type: String
    Default: 'Flying-Pig-Labs'
    Description: GitHub organization
    
  OIDCProviderArn:
    Description: ARN of the GitHub OIDC Provider (leave empty to create new)
    Type: String
    Default: ""

Conditions:
  CreateOIDCProvider: !Equals [!Ref OIDCProviderArn, ""]

Resources:
  # Create GitHub OIDC Provider if it doesn't exist
  GithubOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # IAM Role for GitHub Actions
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: 'github-actions-flying-pig-labs'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOIDCProvider
                - !Ref GithubOidc
                - !Ref OIDCProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': 'sts.amazonaws.com'
              StringLike:
                'token.actions.githubusercontent.com:sub': 
                  - !Sub 'repo:${GitHubOrg}/blue-ocean-research:ref:refs/heads/main'
                  - !Sub 'repo:${GitHubOrg}/blue-ocean-ideation:ref:refs/heads/main'
                  - !Sub 'repo:${GitHubOrg}/color-code-research-hub:ref:refs/heads/main'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess  # You should restrict this in production
      Tags:
        - Key: Purpose
          Value: GitHubActions
        - Key: Organization
          Value: !Ref GitHubOrg
        - Key: Repositories
          Value: 'blue-ocean-research,blue-ocean-ideation,color-code-research-hub'

  # Custom policy for more restricted permissions (recommended for production)
  GitHubActionsPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: GitHubActionsDeploymentPolicy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # ECR permissions
          - Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
              - ecr:BatchCheckLayerAvailability
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
              - ecr:PutImage
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:CreateRepository
              - ecr:DescribeRepositories
            Resource: '*'
            
          # CloudFormation permissions for CDK
          - Effect: Allow
            Action:
              - cloudformation:*
            Resource: 
              - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/MultiStepLLMBatch-*/*'
              - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/CDKToolkit/*'
              
          # CDK Bootstrap permissions
          - Effect: Allow
            Action:
              - s3:*
            Resource:
              - !Sub 'arn:aws:s3:::cdk-*-assets-${AWS::AccountId}-${AWS::Region}'
              - !Sub 'arn:aws:s3:::cdk-*-assets-${AWS::AccountId}-${AWS::Region}/*'
              
          # Batch permissions
          - Effect: Allow
            Action:
              - batch:*
            Resource: '*'
            
          # Lambda permissions
          - Effect: Allow
            Action:
              - lambda:*
            Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:*'
            
          # API Gateway permissions
          - Effect: Allow
            Action:
              - apigateway:*
            Resource: '*'
            
          # DynamoDB permissions
          - Effect: Allow
            Action:
              - dynamodb:*
            Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/*'
            
          # IAM permissions (limited)
          - Effect: Allow
            Action:
              - iam:GetRole
              - iam:PassRole
              - iam:CreateRole
              - iam:AttachRolePolicy
              - iam:PutRolePolicy
              - iam:UpdateRole
              - iam:DeleteRole
              - iam:GetRolePolicy
              - iam:DeleteRolePolicy
              - iam:ListRolePolicies
              - iam:TagRole
              - iam:UntagRole
            Resource:
              - !Sub 'arn:aws:iam::${AWS::AccountId}:role/MultiStepLLMBatch-*'
              - !Sub 'arn:aws:iam::${AWS::AccountId}:role/cdk-*'
              
          # SSM Parameter Store for CDK
          - Effect: Allow
            Action:
              - ssm:GetParameter
            Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cdk-bootstrap/*'
            
          # Secrets Manager permissions
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:*'
            
      Roles:
        - !Ref GitHubActionsRole

Outputs:
  RoleArn:
    Description: ARN of the IAM role for GitHub Actions
    Value: !GetAtt GitHubActionsRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-RoleArn'
      
  OIDCProviderArn:
    Description: ARN of the GitHub OIDC Provider
    Value: !If
      - CreateOIDCProvider
      - !Ref GithubOidc
      - !Ref OIDCProviderArn
    Export:
      Name: !Sub '${AWS::StackName}-OIDCProviderArn'