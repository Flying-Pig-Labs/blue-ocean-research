AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Multi-Step LLM Pipeline - Serverless Infrastructure

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment

Globals:
  Function:
    Runtime: python3.11
    Timeout: 900
    MemorySize: 1024
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        PYTHONPATH: /opt/python:/var/runtime
    Layers:
      - !Ref LLMSDKsLayer

Resources:
  # S3 Bucket for pipeline data
  PipelineBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'multi-step-llm-${Environment}-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteTempFiles
            Status: Enabled
            ExpirationInDays: 7
            Prefix: temp/
          - Id: DeleteOldFiles
            Status: Enabled
            ExpirationInDays: 30
            Prefix: intermediate/
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # DynamoDB Table for job tracking
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'PipelineJobs-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: StatusIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  # Lambda Layers for dependencies (split to avoid size limits)
  LLMSDKsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub 'pipeline-llm-sdks-${Environment}'
      Description: LLM SDK dependencies (Anthropic, OpenAI, Cohere, EXA)
      ContentUri: layers/llm-sdks/
      CompatibleRuntimes:
        - python3.11
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.11
  
  MLStackLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub 'pipeline-ml-stack-${Environment}'
      Description: ML/Scientific computing stack (numpy, scipy, sklearn, hdbscan)
      ContentUri: layers/ml-stack/
      CompatibleRuntimes:
        - python3.11
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.11

  # API Gateway
  PipelineApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub 'pipeline-api-${Environment}'
      StageName: !Ref Environment
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowMethods: "'GET,POST,OPTIONS'"
      Auth:
        ApiKeyRequired: false

  # Main Lambda Handler
  MainHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'pipeline-main-handler-${Environment}'
      CodeUri: ../src/
      Handler: lambda_main_handler.lambda_handler
      Events:
        StartPipeline:
          Type: Api
          Properties:
            RestApiId: !Ref PipelineApi
            Path: /start-pipeline
            Method: POST
        GetStatus:
          Type: Api
          Properties:
            RestApiId: !Ref PipelineApi
            Path: /status/{jobId}
            Method: GET
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          S3_BUCKET: !Ref PipelineBucket
          STATE_MACHINE_ARN: !Ref PipelineStateMachine
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - S3CrudPolicy:
            BucketName: !Ref PipelineBucket
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - states:StartExecution
                - states:DescribeExecution
              Resource: !Ref PipelineStateMachine

  # Research Analyzer Lambda
  ResearchAnalyzerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'pipeline-research-analyzer-${Environment}'
      CodeUri: ../src/
      Handler: lambda_research_analyzer.lambda_handler
      MemorySize: 1024
      Environment:
        Variables:
          S3_BUCKET: !Ref PipelineBucket
          JOBS_TABLE: !Ref JobsTable
          ANTHROPIC_SECRET_ARN: 'arn:aws:secretsmanager:us-east-1:984906149037:secret:anthropic_key-47iAE6'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - S3CrudPolicy:
            BucketName: !Ref PipelineBucket
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: 'arn:aws:secretsmanager:us-east-1:984906149037:secret:anthropic_key-47iAE6'

  # Jobs Researcher Lambda
  JobsResearcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'pipeline-jobs-researcher-${Environment}'
      CodeUri: ../src/
      Handler: lambda_jobs_researcher.lambda_handler
      MemorySize: 1024
      Environment:
        Variables:
          S3_BUCKET: !Ref PipelineBucket
          JOBS_TABLE: !Ref JobsTable
          EXA_SECRET_ARN: 'arn:aws:secretsmanager:us-east-1:984906149037:secret:exa-key-N7ylem'
          ANTHROPIC_SECRET_ARN: 'arn:aws:secretsmanager:us-east-1:984906149037:secret:anthropic_key-47iAE6'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - S3CrudPolicy:
            BucketName: !Ref PipelineBucket
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: 
                - 'arn:aws:secretsmanager:us-east-1:984906149037:secret:exa-key-N7ylem'
                - 'arn:aws:secretsmanager:us-east-1:984906149037:secret:anthropic_key-47iAE6'

  # Clustering Lambda (Container Image for ML dependencies)
  ClusteringFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'pipeline-clustering-${Environment}'
      PackageType: Image
      Architectures: [x86_64]
      MemorySize: 3008
      Timeout: 900
      ImageUri: clusteringfunction:latest
      Environment:
        Variables:
          S3_BUCKET: !Ref PipelineBucket
          JOBS_TABLE: !Ref JobsTable
          COHERE_SECRET_ARN: 'arn:aws:secretsmanager:us-east-1:984906149037:secret:cohere-key-MxBx6j'
          OPENAI_SECRET_ARN: 'arn:aws:secretsmanager:us-east-1:984906149037:secret:openai_key-PkoBXY'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - S3CrudPolicy:
            BucketName: !Ref PipelineBucket
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - 'arn:aws:secretsmanager:us-east-1:984906149037:secret:cohere-key-MxBx6j'
                - 'arn:aws:secretsmanager:us-east-1:984906149037:secret:openai_key-PkoBXY'
    Metadata:
      DockerTag: latest
      DockerContext: ./clustering-container
      Dockerfile: Dockerfile

  # Opportunity Zones Lambda
  OpportunityZonesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'pipeline-opportunity-zones-${Environment}'
      CodeUri: ../src/
      Handler: lambda_opportunity_zones.lambda_handler
      MemorySize: 2048
      Environment:
        Variables:
          S3_BUCKET: !Ref PipelineBucket
          JOBS_TABLE: !Ref JobsTable
          ANTHROPIC_SECRET_ARN: 'arn:aws:secretsmanager:us-east-1:984906149037:secret:anthropic_key-47iAE6'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - S3CrudPolicy:
            BucketName: !Ref PipelineBucket
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: 'arn:aws:secretsmanager:us-east-1:984906149037:secret:anthropic_key-47iAE6'

  # Value Curves Lambda
  ValueCurvesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'pipeline-value-curves-${Environment}'
      CodeUri: ../src/
      Handler: lambda_value_curves.lambda_handler
      MemorySize: 1024
      Environment:
        Variables:
          S3_BUCKET: !Ref PipelineBucket
          JOBS_TABLE: !Ref JobsTable
          EXA_SECRET_ARN: 'arn:aws:secretsmanager:us-east-1:984906149037:secret:exa-key-N7ylem'
          ANTHROPIC_SECRET_ARN: 'arn:aws:secretsmanager:us-east-1:984906149037:secret:anthropic_key-47iAE6'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - S3CrudPolicy:
            BucketName: !Ref PipelineBucket
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - 'arn:aws:secretsmanager:us-east-1:984906149037:secret:exa-key-N7ylem'
                - 'arn:aws:secretsmanager:us-east-1:984906149037:secret:anthropic_key-47iAE6'

  # Product Ideas Lambda
  ProductIdeasFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'pipeline-product-ideas-${Environment}'
      CodeUri: ../src/
      Handler: lambda_product_ideas.lambda_handler
      MemorySize: 1024
      Environment:
        Variables:
          S3_BUCKET: !Ref PipelineBucket
          JOBS_TABLE: !Ref JobsTable
          OPENAI_SECRET_ARN: 'arn:aws:secretsmanager:us-east-1:984906149037:secret:openai_key-PkoBXY'
          ANTHROPIC_SECRET_ARN: 'arn:aws:secretsmanager:us-east-1:984906149037:secret:anthropic_key-47iAE6'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - S3CrudPolicy:
            BucketName: !Ref PipelineBucket
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - 'arn:aws:secretsmanager:us-east-1:984906149037:secret:openai_key-PkoBXY'
                - 'arn:aws:secretsmanager:us-east-1:984906149037:secret:anthropic_key-47iAE6'

  # Consolidator Lambda
  ConsolidatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'pipeline-consolidator-${Environment}'
      CodeUri: ../src/
      Handler: lambda_consolidator.lambda_handler
      MemorySize: 512
      Timeout: 300
      Environment:
        Variables:
          S3_BUCKET: !Ref PipelineBucket
          JOBS_TABLE: !Ref JobsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - S3CrudPolicy:
            BucketName: !Ref PipelineBucket

  # GitHub Integration Lambda
  GitHubFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'pipeline-github-${Environment}'
      CodeUri: ../src/
      Handler: lambda_github.lambda_handler
      MemorySize: 512
      Timeout: 300
      Environment:
        Variables:
          S3_BUCKET: !Ref PipelineBucket
          JOBS_TABLE: !Ref JobsTable
          GITHUB_SECRET_ARN: 'arn:aws:secretsmanager:us-east-1:984906149037:secret:github_token-sIuriy'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - S3CrudPolicy:
            BucketName: !Ref PipelineBucket
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: 'arn:aws:secretsmanager:us-east-1:984906149037:secret:github_token-sIuriy'

  # Step Functions State Machine
  PipelineStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub 'pipeline-orchestrator-${Environment}'
      StateMachineType: STANDARD
      RoleArn: !GetAtt StepFunctionsRole.Arn
      DefinitionString: !Sub |
        {
          "Comment": "Multi-Step LLM Pipeline Orchestration",
          "StartAt": "InitializeJob",
          "States": {
            "InitializeJob": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${JobsTable}",
                "Key": {
                  "jobId": {"S.$": "$.jobId"}
                },
                "UpdateExpression": "SET #status = :status, currentStage = :stage, updatedAt = :now",
                "ExpressionAttributeNames": {
                  "#status": "status"
                },
                "ExpressionAttributeValues": {
                  ":status": {"S": "RUNNING"},
                  ":stage": {"N": "1"},
                  ":now": {"S.$": "$$.State.EnteredTime"}
                }
              },
              "Next": "ResearchAnalysis",
              "ResultPath": null
            },
            "ResearchAnalysis": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${ResearchAnalyzerFunction}",
                "Payload.$": "$"
              },
              "OutputPath": "$.Payload",
              "Next": "JobsResearch",
              "Retry": [{
                "ErrorEquals": ["States.TaskFailed"],
                "IntervalSeconds": 2,
                "MaxAttempts": 3,
                "BackoffRate": 2
              }],
              "Catch": [{
                "ErrorEquals": ["States.ALL"],
                "Next": "HandleError",
                "ResultPath": "$.error"
              }]
            },
            "JobsResearch": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${JobsResearcherFunction}",
                "Payload.$": "$"
              },
              "OutputPath": "$.Payload",
              "Next": "Clustering",
              "Retry": [{
                "ErrorEquals": ["States.TaskFailed"],
                "IntervalSeconds": 2,
                "MaxAttempts": 3,
                "BackoffRate": 2
              }],
              "Catch": [{
                "ErrorEquals": ["States.ALL"],
                "Next": "HandleError",
                "ResultPath": "$.error"
              }]
            },
            "Clustering": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${ClusteringFunction}",
                "Payload.$": "$"
              },
              "OutputPath": "$.Payload",
              "Next": "OpportunityZones",
              "Retry": [{
                "ErrorEquals": ["States.TaskFailed"],
                "IntervalSeconds": 2,
                "MaxAttempts": 3,
                "BackoffRate": 2
              }],
              "Catch": [{
                "ErrorEquals": ["States.ALL"],
                "Next": "HandleError",
                "ResultPath": "$.error"
              }]
            },
            "OpportunityZones": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${OpportunityZonesFunction}",
                "Payload.$": "$"
              },
              "OutputPath": "$.Payload",
              "Next": "ValueCurves",
              "Retry": [{
                "ErrorEquals": ["States.TaskFailed"],
                "IntervalSeconds": 2,
                "MaxAttempts": 3,
                "BackoffRate": 2
              }],
              "Catch": [{
                "ErrorEquals": ["States.ALL"],
                "Next": "HandleError",
                "ResultPath": "$.error"
              }]
            },
            "ValueCurves": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${ValueCurvesFunction}",
                "Payload.$": "$"
              },
              "OutputPath": "$.Payload",
              "Next": "ProductIdeas",
              "Retry": [{
                "ErrorEquals": ["States.TaskFailed"],
                "IntervalSeconds": 2,
                "MaxAttempts": 3,
                "BackoffRate": 2
              }],
              "Catch": [{
                "ErrorEquals": ["States.ALL"],
                "Next": "HandleError",
                "ResultPath": "$.error"
              }]
            },
            "ProductIdeas": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${ProductIdeasFunction}",
                "Payload.$": "$"
              },
              "OutputPath": "$.Payload",
              "Next": "Consolidation",
              "Retry": [{
                "ErrorEquals": ["States.TaskFailed"],
                "IntervalSeconds": 2,
                "MaxAttempts": 3,
                "BackoffRate": 2
              }],
              "Catch": [{
                "ErrorEquals": ["States.ALL"],
                "Next": "HandleError",
                "ResultPath": "$.error"
              }]
            },
            "Consolidation": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${ConsolidatorFunction}",
                "Payload.$": "$"
              },
              "OutputPath": "$.Payload",
              "Next": "GitHubIntegration",
              "Retry": [{
                "ErrorEquals": ["States.TaskFailed"],
                "IntervalSeconds": 2,
                "MaxAttempts": 3,
                "BackoffRate": 2
              }],
              "Catch": [{
                "ErrorEquals": ["States.ALL"],
                "Next": "HandleError",
                "ResultPath": "$.error"
              }]
            },
            "GitHubIntegration": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${GitHubFunction}",
                "Payload.$": "$"
              },
              "OutputPath": "$.Payload",
              "Next": "CompleteJob",
              "Retry": [{
                "ErrorEquals": ["States.TaskFailed"],
                "IntervalSeconds": 2,
                "MaxAttempts": 3,
                "BackoffRate": 2
              }],
              "Catch": [{
                "ErrorEquals": ["States.ALL"],
                "Next": "HandleError",
                "ResultPath": "$.error"
              }]
            },
            "CompleteJob": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${JobsTable}",
                "Key": {
                  "jobId": {"S.$": "$.jobId"}
                },
                "UpdateExpression": "SET #status = :status, completedAt = :now",
                "ExpressionAttributeNames": {
                  "#status": "status"
                },
                "ExpressionAttributeValues": {
                  ":status": {"S": "COMPLETED"},
                  ":now": {"S.$": "$$.State.EnteredTime"}
                }
              },
              "End": true
            },
            "HandleError": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Parameters": {
                "TableName": "${JobsTable}",
                "Key": {
                  "jobId": {"S.$": "$.jobId"}
                },
                "UpdateExpression": "SET #status = :status, #error = :error",
                "ExpressionAttributeNames": {
                  "#status": "status",
                  "#error": "error"
                },
                "ExpressionAttributeValues": {
                  ":status": {"S": "FAILED"},
                  ":error": {"S.$": "$.error.Error"}
                }
              },
              "Next": "FailState"
            },
            "FailState": {
              "Type": "Fail",
              "Error": "PipelineExecutionFailed",
              "Cause": "One or more stages of the pipeline failed"
            }
          }
        }

  # IAM Role for Step Functions
  StepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
      Policies:
        - PolicyName: StepFunctionsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt ResearchAnalyzerFunction.Arn
                  - !GetAtt JobsResearcherFunction.Arn
                  - !GetAtt ClusteringFunction.Arn
                  - !GetAtt OpportunityZonesFunction.Arn
                  - !GetAtt ValueCurvesFunction.Arn
                  - !GetAtt ProductIdeasFunction.Arn
                  - !GetAtt ConsolidatorFunction.Arn
                  - !GetAtt GitHubFunction.Arn
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                Resource: !GetAtt JobsTable.Arn

  # CloudWatch Log Group for Step Functions
  StepFunctionsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/stepfunctions/pipeline-${Environment}'
      RetentionInDays: 30

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${PipelineApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${AWS::StackName}-ApiEndpoint'

  S3BucketName:
    Description: S3 bucket for pipeline data
    Value: !Ref PipelineBucket
    Export:
      Name: !Sub '${AWS::StackName}-S3Bucket'

  JobsTableName:
    Description: DynamoDB table for job tracking
    Value: !Ref JobsTable
    Export:
      Name: !Sub '${AWS::StackName}-JobsTable'

  StateMachineArn:
    Description: Step Functions state machine ARN
    Value: !Ref PipelineStateMachine
    Export:
      Name: !Sub '${AWS::StackName}-StateMachine'