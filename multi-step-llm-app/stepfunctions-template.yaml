      Runtime: python3.11
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          CHECKPOINT_TABLE: !Ref CheckpointTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CheckpointTable
        - Statement:
          - Effect: Allow
            Action:
              - cloudwatch:PutMetricData
            Resource: "*"
      Events:
        PipelineEvents:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref PipelineEventBus
            Pattern:
              source: ["pipeline.multi-step-llm"]

  # API Gateway for triggering Step Functions
  PipelineApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref EnvironmentName
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"
        MaxAge: "'600'"
      DefinitionBody:
        openapi: 3.0.1
        info:
          title: Multi-Step LLM Pipeline API
          version: '2.0'
        paths:
          /pipeline/start:
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PipelineStarterFunction.Arn}/invocations"
          /pipeline/status/{executionArn}:
            get:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PipelineStatusFunction.Arn}/invocations"
          /pipeline/resume:
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PipelineResumeFunction.Arn}/invocations"

  # API handler functions
  PipelineStarterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "pipeline-api-starter-${EnvironmentName}"
      CodeUri: ./
      Handler: stepfunctions_api.start_pipeline_handler
      Runtime: python3.11
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          STEP_FUNCTION_ARN: !Ref PipelineStateMachine
      Policies:
        - Statement:
          - Effect: Allow
            Action:
              - states:StartExecution
            Resource: !Ref PipelineStateMachine
      Events:
        StartPipelineApi:
          Type: Api
          Properties:
            RestApiId: !Ref PipelineApi
            Path: /pipeline/start
            Method: post

  PipelineStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "pipeline-api-status-${EnvironmentName}"
      CodeUri: ./
      Handler: stepfunctions_api.get_status_handler
      Runtime: python3.11
      Timeout: 30
      MemorySize: 256
      Policies:
        - Statement:
          - Effect: Allow
            Action:
              - states:DescribeExecution
              - states:GetExecutionHistory
            Resource: "*"
      Events:
        GetStatusApi:
          Type: Api
          Properties:
            RestApiId: !Ref PipelineApi
            Path: /pipeline/status/{executionArn}
            Method: get

  PipelineResumeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "pipeline-api-resume-${EnvironmentName}"
      CodeUri: ./
      Handler: stepfunctions_api.resume_pipeline_handler
      Runtime: python3.11
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          STEP_FUNCTION_ARN: !Ref PipelineStateMachine
          CHECKPOINT_TABLE: !Ref CheckpointTable
      Policies:
        - Statement:
          - Effect: Allow
            Action:
              - states:StartExecution
            Resource: !Ref PipelineStateMachine
        - DynamoDBReadPolicy:
            TableName: !Ref CheckpointTable
      Events:
        ResumePipelineApi:
          Type: Api
          Properties:
            RestApiId: !Ref PipelineApi
            Path: /pipeline/resume
            Method: post

Outputs:
  PipelineStateMachineArn:
    Description: "Step Functions State Machine ARN"
    Value: !Ref PipelineStateMachine
    Export:
      Name: !Sub "${AWS::StackName}-StateMachine"

  PipelineApiEndpoint:
    Description: "API Gateway endpoint URL for pipeline operations"
    Value: !Sub "https://${PipelineApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}"
    Export:
      Name: !Sub "${AWS::StackName}-ApiEndpoint"

  PipelineEventBusArn:
    Description: "EventBridge custom bus for pipeline events"
    Value: !GetAtt PipelineEventBus.Arn
    Export:
      Name: !Sub "${AWS::StackName}-EventBus"

  CheckpointTableName:
    Description: "DynamoDB table for pipeline checkpoints"
    Value: !Ref CheckpointTable
    Export:
      Name: !Sub "${AWS::StackName}-CheckpointTable"

  PipelineDataBucketName:
    Description: "S3 bucket for pipeline data storage"
    Value: !Ref PipelineDataBucket
    Export:
      Name: !Sub "${AWS::StackName}-DataBucket"

  MonitoringTopicArn:
    Description: "SNS topic for pipeline monitoring notifications"
    Value: !Ref PipelineMonitoringTopic
    Export:
      Name: !Sub "${AWS::StackName}-MonitoringTopic"