AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Multi-Step LLM Pipeline with Step Functions Orchestration
  Complete AWS infrastructure for the 7-stage product innovation pipeline

Parameters:
  EnvironmentName:
    Type: String
    Default: production
    Description: Environment name (production, staging, development)
    
  StepFunctionExecutionRole:
    Type: String
    Default: ""
    Description: Optional existing IAM role ARN for Step Functions execution

Globals:
  Function:
    Runtime: python3.11
    Timeout: 900
    MemorySize: 1024
    Environment:
      Variables:
        PYTHONPATH: /opt/python
        LOG_LEVEL: INFO

Resources:
  # S3 Bucket for pipeline data and checkpoints
  PipelineDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "pipeline-data-${AWS::AccountId}-${AWS::Region}-${EnvironmentName}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30
          - Id: DeleteIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true

  # DynamoDB table for job tracking and status
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "PipelineJobs-${EnvironmentName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
        - AttributeName: executionId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ExecutionIndex
          KeySchema:
            - AttributeName: executionId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: StatusIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  # DynamoDB table for checkpoints and resume capability
  CheckpointTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "PipelineCheckpoints-${EnvironmentName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: executionId
          AttributeType: S
        - AttributeName: stage
          AttributeType: N
      KeySchema:
        - AttributeName: executionId
          KeyType: HASH
        - AttributeName: stage
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # EventBridge Custom Bus for pipeline events
  PipelineEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "pipeline-events-${EnvironmentName}"
      EventSourceName: pipeline.multi-step-llm

  # EventBridge Rule for pipeline monitoring
  PipelineMonitoringRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref PipelineEventBus
      EventPattern:
        source: ["pipeline.multi-step-llm"]
        detail-type: 
          - "Pipeline Started"
          - "Pipeline Completed"
          - "Pipeline Failed"
          - "Stage Completed"
          - "Stage Failed"
      State: ENABLED
      Targets:
        - Arn: !GetAtt PipelineMonitoringTopic.Arn
          Id: "SNSTarget"
        - Arn: !GetAtt PipelineMetricsFunction.Arn
          Id: "MetricsTarget"

  # SNS Topic for pipeline notifications
  PipelineMonitoringTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "pipeline-monitoring-${EnvironmentName}"
      DisplayName: "Multi-Step LLM Pipeline Monitoring"

  # IAM Role for Step Functions execution
  StepFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "StepFunction-Pipeline-Role-${EnvironmentName}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaRole
      Policies:
        - PolicyName: PipelineExecutionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: 
                  - !GetAtt ResearchAnalyzerFunction.Arn
                  - !GetAtt JTBDResearcherFunction.Arn
                  - !GetAtt JTBDExtractionFunction.Arn
                  - !GetAtt RedditDiscoveryFunction.Arn
                  - !GetAtt ClusteringFunction.Arn
                  - !GetAtt OpportunityAnalyzerFunction.Arn
                  - !GetAtt ValueCurveMapperFunction.Arn
                  - !GetAtt ProductIdeaGeneratorFunction.Arn
                  - !GetAtt IdeaConsolidatorFunction.Arn
                  - !GetAtt GitHubIntegrationFunction.Arn
                  - !GetAtt PipelineMetricsFunction.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt JobsTable.Arn
                  - !Sub "${JobsTable.Arn}/index/*"
                  - !GetAtt CheckpointTable.Arn
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: !GetAtt PipelineEventBus.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "${PipelineDataBucket}/*"

  # Step Functions State Machine
  PipelineStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "MultiStepLLMPipeline-${EnvironmentName}"
      StateMachineType: STANDARD
      RoleArn: !GetAtt StepFunctionExecutionRole.Arn
      DefinitionSubstitutions:
        CheckpointTable: !Ref CheckpointTable
        ResearchAnalyzerFunction: !Ref ResearchAnalyzerFunction
        JTBDResearcherFunction: !Ref JTBDResearcherFunction
        JTBDExtractionFunction: !Ref JTBDExtractionFunction
        RedditDiscoveryFunction: !Ref RedditDiscoveryFunction
        ClusteringFunction: !Ref ClusteringFunction
        OpportunityAnalyzerFunction: !Ref OpportunityAnalyzerFunction
        ValueCurveMapperFunction: !Ref ValueCurveMapperFunction
        ProductIdeaGeneratorFunction: !Ref ProductIdeaGeneratorFunction
        IdeaConsolidatorFunction: !Ref IdeaConsolidatorFunction
        GitHubIntegrationFunction: !Ref GitHubIntegrationFunction
      DefinitionString: !Sub |
        {
          "Comment": "Multi-Step LLM Pipeline - 7 Stage Product Innovation Orchestration",
          "StartAt": "InitializePipeline",
          "States": {
            "InitializePipeline": {
              "Type": "Pass",
              "Comment": "Initialize pipeline execution with metadata and checkpointing",
              "Parameters": {
                "executionId.$": "$$.Execution.Name",
                "startTime.$": "$$.Execution.StartTime",
                "pipelineConfig": {
                  "stages": 7,
                  "maxRetries": 3,
                  "checkpointEnabled": true,
                  "parallelismEnabled": true
                },
                "input.$": "$",
                "metadata": {
                  "version": "2.0",
                  "environment": "${EnvironmentName}"
                }
              },
              "ResultPath": "$.pipeline",
              "Next": "PublishPipelineStarted"
            },
            "PublishPipelineStarted": {
              "Type": "Task",
              "Resource": "arn:aws:states:::events:putEvents",
              "Parameters": {
                "Entries": [
                  {
                    "Source": "pipeline.multi-step-llm",
                    "DetailType": "Pipeline Started",
                    "Detail": {
                      "executionId.$": "$.pipeline.executionId",
                      "startTime.$": "$.pipeline.startTime",
                      "inputSize.$": "States.StringLength(States.JsonToString($.input))"
                    },
                    "EventBusName": "${PipelineEventBus}"
                  }
                ]
              },
              "ResultPath": "$.events.started",
              "Next": "CheckResumePoint",
              "Retry": [
                {
                  "ErrorEquals": ["States.TaskFailed"],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2.0
                }
              ]
            },
            "CheckResumePoint": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.input.resumeFromStage",
                  "NumericGreaterThan": 1,
                  "Next": "ResumeFromCheckpoint"
                }
              ],
              "Default": "Stage1_ResearchAnalysis"
            },
            "ResumeFromCheckpoint": {
              "Type": "Pass",
              "Parameters": {
                "resumeStage.$": "$.input.resumeFromStage",
                "checkpointData.$": "$.input.checkpointData"
              },
              "ResultPath": "$.resume",
              "Next": "ChooseResumeStage"
            },
            "ChooseResumeStage": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.resume.resumeStage",
                  "NumericEquals": 2,
                  "Next": "Stage2_JTBDResearch"
                },
                {
                  "Variable": "$.resume.resumeStage",
                  "NumericEquals": 3,
                  "Next": "Stage3_Clustering"
                },
                {
                  "Variable": "$.resume.resumeStage",
                  "NumericEquals": 4,
                  "Next": "Stage4_ValueCurveMapping"
                },
                {
                  "Variable": "$.resume.resumeStage",
                  "NumericEquals": 5,
                  "Next": "Stage5_ProductIdeaGeneration"
                },
                {
                  "Variable": "$.resume.resumeStage",
                  "NumericEquals": 6,
                  "Next": "Stage6_IdeaConsolidation"
                },
                {
                  "Variable": "$.resume.resumeStage",
                  "NumericEquals": 7,
                  "Next": "Stage7_GitHubIntegration"
                }
              ],
              "Default": "Stage1_ResearchAnalysis"
            },
            "Stage1_ResearchAnalysis": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${ResearchAnalyzerFunction}",
                "Payload": {
                  "stage": 1,
                  "stageName": "ResearchAnalysis",
                  "executionId.$": "$.pipeline.executionId",
                  "input.$": "$.input",
                  "config": {
                    "parallelTasks": 4,
                    "models": ["claude-3-5-sonnet-20241022", "claude-3-opus-20240229"],
                    "timeout": 300,
                    "maxTokens": 4000
                  }
                }
              },
              "ResultPath": "$.stage1",
              "TimeoutSeconds": 600,
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException"],
                  "IntervalSeconds": 5,
                  "MaxAttempts": 3,
                  "BackoffRate": 2.0
                },
                {
                  "ErrorEquals": ["Lambda.SdkClientException"],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 5,
                  "BackoffRate": 1.5
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "PipelineFailure",
                  "ResultPath": "$.error"
                }
              ],
              "Next": "CreateCheckpoint1"
            },
            "CreateCheckpoint1": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:putItem",
              "Parameters": {
                "TableName": "${CheckpointTable}",
                "Item": {
                  "executionId": {
                    "S.$": "$.pipeline.executionId"
                  },
                  "stage": {
                    "N": "1"
                  },
                  "completedAt": {
                    "S.$": "$$.State.EnteredTime"
                  },
                  "output": {
                    "S.$": "States.JsonToString($.stage1.Payload.output)"
                  },
                  "ttl": {
                    "N.$": "States.StringToJson(States.Format('{}', States.MathAdd(States.StringToJson(States.StringToJson($$.State.EnteredTime)), 2592000)))"
                  }
                }
              },
              "ResultPath": "$.checkpoint1",
              "Next": "Stage2_JTBDResearch"
            },
            "Stage2_JTBDResearch": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${JTBDResearcherFunction}",
                "Payload": {
                  "stage": 2,
                  "stageName": "JTBDResearch",
                  "executionId.$": "$.pipeline.executionId",
                  "input.$": "$.stage1.Payload.output",
                  "config": {
                    "searchSources": ["reddit", "reviews", "interviews", "news", "tutorials"],
                    "maxResults": 50,
                    "timeout": 240
                  }
                }
              },
              "ResultPath": "$.stage2",
              "TimeoutSeconds": 480,
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException"],
                  "IntervalSeconds": 5,
                  "MaxAttempts": 3,
                  "BackoffRate": 2.0
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "PipelineFailure",
                  "ResultPath": "$.error"
                }
              ],
              "Next": "ParallelStage2Extensions"
            },
            "ParallelStage2Extensions": {
              "Type": "Parallel",
              "Branches": [
                {
                  "StartAt": "Stage2_5_JTBDExtraction",
                  "States": {
                    "Stage2_5_JTBDExtraction": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::lambda:invoke",
                      "Parameters": {
                        "FunctionName": "${JTBDExtractionFunction}",
                        "Payload": {
                          "stage": 2.5,
                          "stageName": "JTBDExtraction",
                          "executionId.$": "$.pipeline.executionId",
                          "input.$": "$.stage2.Payload.output"
                        }
                      },
                      "End": true,
                      "Retry": [
                        {
                          "ErrorEquals": ["Lambda.ServiceException"],
                          "IntervalSeconds": 3,
                          "MaxAttempts": 2
                        }
                      ]
                    }
                  }
                },
                {
                  "StartAt": "Stage2_5_RedditDiscovery",
                  "States": {
                    "Stage2_5_RedditDiscovery": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::lambda:invoke",
                      "Parameters": {
                        "FunctionName": "${RedditDiscoveryFunction}",
                        "Payload": {
                          "stage": 2.5,
                          "stageName": "RedditDiscovery",
                          "executionId.$": "$.pipeline.executionId",
                          "input.$": "$.stage2.Payload.output"
                        }
                      },
                      "End": true,
                      "Retry": [
                        {
                          "ErrorEquals": ["Lambda.ServiceException"],
                          "IntervalSeconds": 3,
                          "MaxAttempts": 2
                        }
                      ]
                    }
                  }
                }
              ],
              "ResultPath": "$.stage2_5",
              "Next": "CreateCheckpoint2",
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "CreateCheckpoint2",
                  "ResultPath": "$.stage2_5_error"
                }
              ]
            },
            "CreateCheckpoint2": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:putItem",
              "Parameters": {
                "TableName": "${CheckpointTable}",
                "Item": {
                  "executionId": {
                    "S.$": "$.pipeline.executionId"
                  },
                  "stage": {
                    "N": "2"
                  },
                  "completedAt": {
                    "S.$": "$$.State.EnteredTime"
                  },
                  "output": {
                    "S.$": "States.JsonToString($.stage2.Payload.output)"
                  },
                  "ttl": {
                    "N.$": "States.StringToJson(States.Format('{}', States.MathAdd(States.StringToJson(States.StringToJson($$.State.EnteredTime)), 2592000)))"
                  }
                }
              },
              "ResultPath": "$.checkpoint2",
              "Next": "Stage3_Clustering"
            },
            "Stage3_Clustering": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${ClusteringFunction}",
                "Payload": {
                  "stage": 3,
                  "stageName": "JTBDClustering",
                  "executionId.$": "$.pipeline.executionId",
                  "input.$": "$.stage2.Payload.output",
                  "extensions.$": "$.stage2_5",
                  "config": {
                    "embeddingModel": "cohere-embed-v3",
                    "clusteringAlgorithm": "hdbscan",
                    "labelingModel": "gpt-4o",
                    "minClusterSize": 3,
                    "timeout": 180
                  }
                }
              },
              "ResultPath": "$.stage3",
              "TimeoutSeconds": 360,
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException"],
                  "IntervalSeconds": 5,
                  "MaxAttempts": 3,
                  "BackoffRate": 2.0
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "PipelineFailure",
                  "ResultPath": "$.error"
                }
              ],
              "Next": "Stage3_5_OpportunityAnalysis"
            },
            "Stage3_5_OpportunityAnalysis": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${OpportunityAnalyzerFunction}",
                "Payload": {
                  "stage": 3.5,
                  "stageName": "OpportunityZoneAnalysis",
                  "executionId.$": "$.pipeline.executionId",
                  "clusters.$": "$.stage3.Payload.output",
                  "jtbdData.$": "$.stage2.Payload.output",
                  "config": {
                    "nZones": 7,
                    "maxDiscussions": 3,
                    "analysisDepth": "comprehensive"
                  }
                }
              },
              "ResultPath": "$.stage3_5",
              "TimeoutSeconds": 300,
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException"],
                  "IntervalSeconds": 3,
                  "MaxAttempts": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "CreateCheckpoint3",
                  "ResultPath": "$.stage3_5_error"
                }
              ],
              "Next": "CreateCheckpoint3"
            },
            "CreateCheckpoint3": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:putItem",
              "Parameters": {
                "TableName": "${CheckpointTable}",
                "Item": {
                  "executionId": {
                    "S.$": "$.pipeline.executionId"
                  },
                  "stage": {
                    "N": "3"
                  },
                  "completedAt": {
                    "S.$": "$$.State.EnteredTime"
                  },
                  "clusters": {
                    "S.$": "States.JsonToString($.stage3.Payload.output)"
                  },
                  "ttl": {
                    "N.$": "States.StringToJson(States.Format('{}', States.MathAdd(States.StringToJson(States.StringToJson($$.State.EnteredTime)), 2592000)))"
                  }
                }
              },
              "ResultPath": "$.checkpoint3",
              "Next": "Stage4_ValueCurveMapping"
            },
            "Stage4_ValueCurveMapping": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${ValueCurveMapperFunction}",
                "Payload": {
                  "stage": 4,
                  "stageName": "ValueCurveMapping",
                  "executionId.$": "$.pipeline.executionId",
                  "opportunityZones.$": "$.stage3_5.Payload.output",
                  "config": {
                    "model": "claude-3-opus-20240229",
                    "parallelAnalysis": true,
                    "exaSearchEnabled": true,
                    "timeout": 360
                  }
                }
              },
              "ResultPath": "$.stage4",
              "TimeoutSeconds": 720,
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException"],
                  "IntervalSeconds": 10,
                  "MaxAttempts": 3,
                  "BackoffRate": 2.0
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "PipelineFailure",
                  "ResultPath": "$.error"
                }
              ],
              "Next": "CreateCheckpoint4"
            },
            "CreateCheckpoint4": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:putItem",
              "Parameters": {
                "TableName": "${CheckpointTable}",
                "Item": {
                  "executionId": {
                    "S.$": "$.pipeline.executionId"
                  },
                  "stage": {
                    "N": "4"
                  },
                  "completedAt": {
                    "S.$": "$$.State.EnteredTime"
                  },
                  "valueCurves": {
                    "S.$": "States.JsonToString($.stage4.Payload.output)"
                  },
                  "ttl": {
                    "N.$": "States.StringToJson(States.Format('{}', States.MathAdd(States.StringToJson(States.StringToJson($$.State.EnteredTime)), 2592000)))"
                  }
                }
              },
              "ResultPath": "$.checkpoint4",
              "Next": "Stage5_ProductIdeaGeneration"
            },
            "Stage5_ProductIdeaGeneration": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${ProductIdeaGeneratorFunction}",
                "Payload": {
                  "stage": 5,
                  "stageName": "ProductIdeaGeneration",
                  "executionId.$": "$.pipeline.executionId",
                  "valueCurves.$": "$.stage4.Payload.output",
                  "config": {
                    "models": ["o1-preview", "claude-3-opus-20240229"],
                    "ideaCount": 20,
                    "diversityThreshold": 0.7,
                    "timeout": 480
                  }
                }
              },
              "ResultPath": "$.stage5",
              "TimeoutSeconds": 960,
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException"],
                  "IntervalSeconds": 15,
                  "MaxAttempts": 3,
                  "BackoffRate": 2.0
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "PipelineFailure",
                  "ResultPath": "$.error"
                }
              ],
              "Next": "CreateCheckpoint5"
            },
            "CreateCheckpoint5": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:putItem",
              "Parameters": {
                "TableName": "${CheckpointTable}",
                "Item": {
                  "executionId": {
                    "S.$": "$.pipeline.executionId"
                  },
                  "stage": {
                    "N": "5"
                  },
                  "completedAt": {
                    "S.$": "$$.State.EnteredTime"
                  },
                  "productIdeas": {
                    "S.$": "States.JsonToString($.stage5.Payload.output)"
                  },
                  "ttl": {
                    "N.$": "States.StringToJson(States.Format('{}', States.MathAdd(States.StringToJson(States.StringToJson($$.State.EnteredTime)), 2592000)))"
                  }
                }
              },
              "ResultPath": "$.checkpoint5",
              "Next": "Stage6_IdeaConsolidation"
            },
            "Stage6_IdeaConsolidation": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${IdeaConsolidatorFunction}",
                "Payload": {
                  "stage": 6,
                  "stageName": "IdeaConsolidation",
                  "executionId.$": "$.pipeline.executionId",
                  "productIdeas.$": "$.stage5.Payload.output",
                  "config": {
                    "consolidationStrategy": "smart_merge",
                    "portfolioSize": 10,
                    "diversityOptimization": true,
                    "timeout": 240
                  }
                }
              },
              "ResultPath": "$.stage6",
              "TimeoutSeconds": 480,
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException"],
                  "IntervalSeconds": 10,
                  "MaxAttempts": 3,
                  "BackoffRate": 2.0
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "PipelineFailure",
                  "ResultPath": "$.error"
                }
              ],
              "Next": "CreateCheckpoint6"
            },
            "CreateCheckpoint6": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:putItem",
              "Parameters": {
                "TableName": "${CheckpointTable}",
                "Item": {
                  "executionId": {
                    "S.$": "$.pipeline.executionId"
                  },
                  "stage": {
                    "N": "6"
                  },
                  "completedAt": {
                    "S.$": "$$.State.EnteredTime"
                  },
                  "consolidatedPortfolio": {
                    "S.$": "States.JsonToString($.stage6.Payload.output)"
                  },
                  "ttl": {
                    "N.$": "States.StringToJson(States.Format('{}', States.MathAdd(States.StringToJson(States.StringToJson($$.State.EnteredTime)), 2592000)))"
                  }
                }
              },
              "ResultPath": "$.checkpoint6",
              "Next": "CheckGitHubIntegrationEnabled"
            },
            "CheckGitHubIntegrationEnabled": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.input.createGitHubRepo",
                  "BooleanEquals": false,
                  "Next": "SkipGitHubIntegration"
                }
              ],
              "Default": "Stage7_GitHubIntegration"
            },
            "SkipGitHubIntegration": {
              "Type": "Pass",
              "Parameters": {
                "message": "GitHub integration skipped per user request",
                "output": {
                  "portfolioData.$": "$.stage6.Payload.output"
                }
              },
              "ResultPath": "$.stage7",
              "Next": "PipelineCompleteSuccess"
            },
            "Stage7_GitHubIntegration": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${GitHubIntegrationFunction}",
                "Payload": {
                  "stage": 7,
                  "stageName": "GitHubIntegration",
                  "executionId.$": "$.pipeline.executionId",
                  "consolidatedPortfolio.$": "$.stage6.Payload.output",
                  "allStagesData": {
                    "stage1.$": "$.stage1.Payload.output",
                    "stage2.$": "$.stage2.Payload.output",
                    "stage3.$": "$.stage3.Payload.output",
                    "stage4.$": "$.stage4.Payload.output",
                    "stage5.$": "$.stage5.Payload.output",
                    "stage6.$": "$.stage6.Payload.output"
                  },
                  "config": {
                    "organization": "ocean-studio-repos",
                    "repoVisibility": "public",
                    "createIssues": true,
                    "labelingSystem": true,
                    "timeout": 180
                  }
                }
              },
              "ResultPath": "$.stage7",
              "TimeoutSeconds": 360,
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException"],
                  "IntervalSeconds": 5,
                  "MaxAttempts": 3,
                  "BackoffRate": 2.0
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "GitHubIntegrationFailure",
                  "ResultPath": "$.error"
                }
              ],
              "Next": "CreateFinalCheckpoint"
            },
            "CreateFinalCheckpoint": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:putItem",
              "Parameters": {
                "TableName": "${CheckpointTable}",
                "Item": {
                  "executionId": {
                    "S.$": "$.pipeline.executionId"
                  },
                  "stage": {
                    "N": "7"
                  },
                  "completedAt": {
                    "S.$": "$$.State.EnteredTime"
                  },
                  "finalOutput": {
                    "S.$": "States.JsonToString($.stage7.Payload.output)"
                  },
                  "pipelineStatus": {
                    "S": "COMPLETED"
                  },
                  "ttl": {
                    "N.$": "States.StringToJson(States.Format('{}', States.MathAdd(States.StringToJson(States.StringToJson($$.State.EnteredTime)), 2592000)))"
                  }
                }
              },
              "ResultPath": "$.finalCheckpoint",
              "Next": "PipelineCompleteSuccess"
            },
            "PipelineCompleteSuccess": {
              "Type": "Task",
              "Resource": "arn:aws:states:::events:putEvents",
              "Parameters": {
                "Entries": [
                  {
                    "Source": "pipeline.multi-step-llm",
                    "DetailType": "Pipeline Completed",
                    "Detail": {
                      "executionId.$": "$.pipeline.executionId",
                      "stagesCompleted": 7,
                      "finalRepositoryUrl.$": "$.stage7.Payload.output.repositoryUrl",
                      "pipelineVersion": "2.0",
                      "success": true
                    },
                    "EventBusName": "${PipelineEventBus}"
                  }
                ]
              },
              "Next": "FinalSuccess"
            },
            "FinalSuccess": {
              "Type": "Succeed",
              "OutputPath": "$.stage7.Payload.output"
            },
            "PipelineFailure": {
              "Type": "Task",
              "Resource": "arn:aws:states:::events:putEvents",
              "Parameters": {
                "Entries": [
                  {
                    "Source": "pipeline.multi-step-llm",
                    "DetailType": "Pipeline Failed",
                    "Detail": {
                      "executionId.$": "$.pipeline.executionId",
                      "failureReason.$": "$.error.Cause",
                      "pipelineVersion": "2.0"
                    },
                    "EventBusName": "${PipelineEventBus}"
                  }
                ]
              },
              "Next": "FinalFailure"
            },
            "GitHubIntegrationFailure": {
              "Type": "Task",
              "Resource": "arn:aws:states:::events:putEvents",
              "Parameters": {
                "Entries": [
                  {
                    "Source": "pipeline.multi-step-llm",
                    "DetailType": "Pipeline Critical Failure",
                    "Detail": {
                      "executionId.$": "$.pipeline.executionId",
                      "failureReason": "GitHub integration failed - mandatory final step",
                      "criticalFailure": true
                    },
                    "EventBusName": "${PipelineEventBus}"
                  }
                ]
              },
              "Next": "FinalFailure"
            },
            "FinalFailure": {
              "Type": "Fail",
              "Cause": "Pipeline execution failed",
              "Error": "PipelineExecutionFailed"
            }
          }
        }

