[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=.
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=70
    --maxfail=10
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    stress: marks tests as stress tests (deselect with '-m "not stress"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    security: marks tests as security validation tests
    performance: marks tests as performance tests
    lambda: marks tests specific to Lambda functions
    dynamodb: marks tests specific to DynamoDB operations
    api: marks tests for API Gateway functionality