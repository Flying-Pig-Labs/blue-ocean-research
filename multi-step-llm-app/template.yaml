AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Multi-step LLM Pipeline with Real-time Updates
  Complete infrastructure with GraphQL subscriptions, Lambda functions, and React Flow visualization

Parameters:
  EnvironmentName:
    Type: String
    Default: production
    Description: Environment name (production, staging, development)

Globals:
  Function:
    Runtime: python3.11
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        PYTHONPATH: /opt/python

Resources:
  # S3 Bucket for pipeline data
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "pipeline-data-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  # DynamoDB table for job tracking with streams enabled
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "PipelineJobs-${EnvironmentName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
        - AttributeName: username
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIndex
          KeySchema:
            - AttributeName: username
              KeyType: HASH
            - AttributeName: status
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  # AppSync GraphQL API
  GraphQLApi:
    Type: AWS::AppSync::GraphQLApi
    Properties:
      Name: !Sub "multi-step-pipeline-${EnvironmentName}"
      AuthenticationType: API_KEY
      AdditionalAuthenticationProviders:
        - AuthenticationType: AWS_IAM
      LogConfig:
        FieldLogLevel: ALL
        CloudWatchLogsRoleArn: !GetAtt AppSyncServiceRole.Arn
      XrayEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: MultiStepPipeline

  # API Key for GraphQL
  GraphQLApiKey:
    Type: AWS::AppSync::ApiKey
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      Description: !Sub "API Key for ${EnvironmentName} environment"
      Expires: 1735689600  # 2025-01-01

  # GraphQL Schema
  GraphQLSchema:
    Type: AWS::AppSync::GraphQLSchema
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      Definition: !Sub |
        type ExecutionUpdate {
          jobId: ID!
          status: ExecutionStatus!
          currentStage: Int!
          stageName: String!
          stageProgress: Float!
          overallProgress: Float!
          estimatedRemainingMinutes: Int
          completedStages: [StageUpdate!]!
          currentStageUpdate: StageUpdate
          error: String
          timestamp: AWSDateTime!
          metadata: ExecutionMetadata
          results: ExecutionResults
        }

        type StageUpdate {
          stageId: Int!
          name: String!
          status: StageStatus!
          progress: Float!
          startedAt: AWSDateTime
          completedAt: AWSDateTime
          estimatedMinutes: Int
          actualMinutes: Int
          outputs: [StageOutput!]
          error: String
          metadata: AWSJSON
        }

        type StageOutput {
          fileName: String!
          fileSize: Int
          contentPreview: String
          s3Location: String
          generatedAt: AWSDateTime!
        }

        type ExecutionMetadata {
          researchDocId: String!
          username: String!
          startedAt: AWSDateTime!
          completedAt: AWSDateTime
          totalStages: Int!
          estimatedTotalMinutes: Int!
          actualDurationMinutes: Int
          pipelineVersion: String
        }

        type ExecutionResults {
          githubRepoUrl: String
          githubRepoName: String
          issuesCreated: Int
          analysisResults: AWSJSON
          finalPortfolio: AWSJSON
        }

        enum ExecutionStatus {
          QUEUED
          RUNNING
          COMPLETED
          FAILED
          CANCELLED
        }

        enum StageStatus {
          PENDING
          RUNNING
          COMPLETED
          FAILED
          SKIPPED
        }

        type Query {
          getExecution(jobId: ID!): ExecutionUpdate
          listExecutions(username: String, status: ExecutionStatus, limit: Int, nextToken: String): ExecutionConnection
        }

        type ExecutionConnection {
          items: [ExecutionUpdate!]!
          nextToken: String
        }

        type Mutation {
          startExecution(input: StartExecutionInput!): ExecutionUpdate!
          updateStageProgress(input: UpdateStageProgressInput!): ExecutionUpdate!
        }

        input StartExecutionInput {
          researchDocId: String!
          username: String!
          pipelineConfig: AWSJSON
        }

        input UpdateStageProgressInput {
          jobId: ID!
          stageId: Int!
          progress: Float!
          status: StageStatus
          outputs: [StageOutputInput!]
          metadata: AWSJSON
        }

        input StageOutputInput {
          fileName: String!
          fileSize: Int
          contentPreview: String
          s3Location: String
        }

        type Subscription {
          onExecutionUpdate(jobId: ID): ExecutionUpdate
            @aws_subscribe(mutations: ["updateStageProgress"])
        }

        schema {
          query: Query
          mutation: Mutation
          subscription: Subscription
        }

  # Service Role for AppSync
  AppSyncServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: appsync.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AppSyncDynamoDBPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: 
                  - !GetAtt JobsTable.Arn
                  - !Sub "${JobsTable.Arn}/index/*"
        - PolicyName: AppSyncLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt GraphQLResolverFunction.Arn
        - PolicyName: AppSyncLogsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  # DynamoDB Data Source
  DynamoDBDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      Name: DynamoDBJobsTable
      Type: AMAZON_DYNAMODB
      ServiceRoleArn: !GetAtt AppSyncServiceRole.Arn
      DynamoDBConfig:
        TableName: !Ref JobsTable
        AwsRegion: !Ref AWS::Region

  # Lambda Data Source for GraphQL resolvers
  LambdaDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      Name: GraphQLResolverLambda
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncServiceRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt GraphQLResolverFunction.Arn

  # GraphQL resolver Lambda function
  GraphQLResolverFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "pipeline-graphql-resolver-${EnvironmentName}"
      CodeUri: graphql/resolvers/
      Handler: index.handler
      Runtime: nodejs18.x
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          ORCHESTRATOR_FUNCTION_NAME: !Ref OrchestratorFunction
          ENVIRONMENT: !Ref EnvironmentName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - LambdaInvokePolicy:
            FunctionName: !Ref OrchestratorFunction

  # Stream processor for real-time updates
  StreamProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "pipeline-stream-processor-${EnvironmentName}"
      CodeUri: graphql/stream-processor/
      Handler: index.handler
      Runtime: nodejs18.x
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          GRAPHQL_API_URL: !GetAtt GraphQLApi.GraphQLUrl
          GRAPHQL_API_ID: !GetAtt GraphQLApi.ApiId
      Events:
        DynamoDBStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt JobsTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 5
      Policies:
        - Statement:
          - Effect: Allow
            Action:
              - appsync:GraphQL
            Resource: !Sub "${GraphQLApi.Arn}/*"

  # GraphQL Resolvers
  GetExecutionResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Query
      FieldName: getExecution
      DataSourceName: !GetAtt DynamoDBDataSource.Name
      RequestMappingTemplate: |
        {
          "version": "2017-02-28",
          "operation": "GetItem",
          "key": {
            "jobId": $util.dynamodb.toDynamoDBJson($ctx.args.jobId)
          }
        }
      ResponseMappingTemplate: |
        #if($ctx.error)
          $util.error($ctx.error.message, $ctx.error.type)
        #end
        $util.toJson($ctx.result)

  ListExecutionsResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Query
      FieldName: listExecutions
      DataSourceName: !GetAtt LambdaDataSource.Name
      RequestMappingTemplate: |
        {
          "version": "2017-02-28",
          "operation": "Invoke",
          "payload": {
            "field": "listExecutions",
            "arguments": $util.toJson($ctx.args)
          }
        }
      ResponseMappingTemplate: |
        $util.toJson($ctx.result)

  StartExecutionResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Mutation
      FieldName: startExecution
      DataSourceName: !GetAtt LambdaDataSource.Name
      RequestMappingTemplate: |
        {
          "version": "2017-02-28",
          "operation": "Invoke",
          "payload": {
            "field": "startExecution",
            "arguments": $util.toJson($ctx.args)
          }
        }
      ResponseMappingTemplate: |
        $util.toJson($ctx.result)

  UpdateStageProgressResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Mutation
      FieldName: updateStageProgress
      DataSourceName: !GetAtt LambdaDataSource.Name
      RequestMappingTemplate: |
        {
          "version": "2017-02-28",
          "operation": "Invoke",
          "payload": {
            "field": "updateStageProgress",
            "arguments": $util.toJson($ctx.args)
          }
        }
      ResponseMappingTemplate: |
        $util.toJson($ctx.result)

  # API Gateway (Enhanced)
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref EnvironmentName
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"
        MaxAge: "'600'"
      DefinitionBody:
        openapi: 3.0.1
        info:
          title: Multi-step LLM Pipeline API
          version: '1.0'
        paths:
          /start-pipeline:
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${StarterFunction.Arn}/invocations"
            options:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${StarterFunction.Arn}/invocations"
          /status/{jobId}:
            get:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${StarterFunction.Arn}/invocations"
            options:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${StarterFunction.Arn}/invocations"
          /logs/{jobId}:
            get:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${StarterFunction.Arn}/invocations"

  # Starter Lambda Function (handles API requests)
  StarterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "pipeline-starter-${EnvironmentName}"
      CodeUri: ./
      Handler: lambda_handler.lambda_handler
      Runtime: python3.11
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          ORCHESTRATOR_FUNCTION_NAME: !Ref OrchestratorFunction
          S3_BUCKET: !Ref S3Bucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - LambdaInvokePolicy:
            FunctionName: !Ref OrchestratorFunction
        - S3CrudPolicy:
            BucketName: !Ref S3Bucket
      Events:
        StartPipeline:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /start-pipeline
            Method: post
        GetStatus:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /status/{jobId}
            Method: get
        GetLogs:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /logs/{jobId}
            Method: get
        OptionsStartPipeline:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /start-pipeline
            Method: options
        OptionsStatus:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /status/{jobId}
            Method: options
        OptionsLogs:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /logs/{jobId}
            Method: options

  # Orchestrator Lambda Function (runs the actual pipeline)
  OrchestratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "pipeline-orchestrator-${EnvironmentName}"
      CodeUri: ./
      Handler: lambda_handler.orchestrator_handler
      Runtime: python3.11
      Timeout: 900  # 15 minutes
      MemorySize: 3008
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          S3_BUCKET: !Ref S3Bucket
          ANTHROPIC_API_KEY: !Sub "{{resolve:secretsmanager:pipeline-secrets:SecretString:ANTHROPIC_API_KEY}}"
          OPENAI_API_KEY: !Sub "{{resolve:secretsmanager:pipeline-secrets:SecretString:OPENAI_API_KEY}}"
          EXA_API_KEY: !Sub "{{resolve:secretsmanager:pipeline-secrets:SecretString:EXA_API_KEY}}"
          COHERE_API_KEY: !Sub "{{resolve:secretsmanager:pipeline-secrets:SecretString:COHERE_API_KEY}}"
          GITHUB_TOKEN: !Sub "{{resolve:secretsmanager:pipeline-secrets:SecretString:GITHUB_TOKEN}}"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - S3CrudPolicy:
            BucketName: !Ref S3Bucket
        - Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: 
              - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:pipeline-secrets*"

  # Enhanced Lambda handler with GraphQL integration
  StarterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "pipeline-starter-${EnvironmentName}"
      CodeUri: ./
      Handler: enhanced_lambda_handler.lambda_handler
      Runtime: python3.11
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          ORCHESTRATOR_FUNCTION_NAME: !Ref OrchestratorFunction
          S3_BUCKET: !Ref S3Bucket
          GRAPHQL_API_URL: !GetAtt GraphQLApi.GraphQLUrl
          GRAPHQL_API_ID: !GetAtt GraphQLApi.ApiId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - LambdaInvokePolicy:
            FunctionName: !Ref OrchestratorFunction
        - S3CrudPolicy:
            BucketName: !Ref S3Bucket
        - Statement:
          - Effect: Allow
            Action:
              - appsync:GraphQL
            Resource: !Sub "${GraphQLApi.Arn}/*"
      Events:
        StartPipeline:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /start-pipeline
            Method: post
        GetStatus:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /status/{jobId}
            Method: get
        GetLogs:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /logs/{jobId}
            Method: get

  # Orchestrator Lambda Function (Enhanced with GraphQL)
  OrchestratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "pipeline-orchestrator-${EnvironmentName}"
      CodeUri: ./
      Handler: enhanced_lambda_handler.enhanced_orchestrator_handler
      Runtime: python3.11
      Timeout: 900  # 15 minutes
      MemorySize: 3008
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          S3_BUCKET: !Ref S3Bucket
          GRAPHQL_API_URL: !GetAtt GraphQLApi.GraphQLUrl
          GRAPHQL_API_ID: !GetAtt GraphQLApi.ApiId
          ANTHROPIC_API_KEY: !Sub "{{resolve:secretsmanager:pipeline-secrets:SecretString:ANTHROPIC_API_KEY}}"
          OPENAI_API_KEY: !Sub "{{resolve:secretsmanager:pipeline-secrets:SecretString:OPENAI_API_KEY}}"
          EXA_API_KEY: !Sub "{{resolve:secretsmanager:pipeline-secrets:SecretString:EXA_API_KEY}}"
          COHERE_API_KEY: !Sub "{{resolve:secretsmanager:pipeline-secrets:SecretString:COHERE_API_KEY}}"
          GITHUB_TOKEN: !Sub "{{resolve:secretsmanager:pipeline-secrets:SecretString:GITHUB_TOKEN}}"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - S3CrudPolicy:
            BucketName: !Ref S3Bucket
        - Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: 
              - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:pipeline-secrets*"
          - Effect: Allow
            Action:
              - appsync:GraphQL
            Resource: !Sub "${GraphQLApi.Arn}/*"

Outputs:
  # REST API Outputs
  ApiEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}"
    Export:
      Name: !Sub "${AWS::StackName}-ApiEndpoint"

  StarterFunctionArn:
    Description: "Starter Lambda function ARN"
    Value: !GetAtt StarterFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-StarterFunction"

  OrchestratorFunctionArn:
    Description: "Orchestrator Lambda function ARN"
    Value: !GetAtt OrchestratorFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-OrchestratorFunction"

  # GraphQL Outputs
  GraphQLApiUrl:
    Description: "GraphQL API URL for real-time subscriptions"
    Value: !GetAtt GraphQLApi.GraphQLUrl
    Export:
      Name: !Sub "${AWS::StackName}-GraphQLUrl"

  GraphQLApiId:
    Description: "GraphQL API ID"
    Value: !GetAtt GraphQLApi.ApiId
    Export:
      Name: !Sub "${AWS::StackName}-GraphQLApiId"

  GraphQLApiKey:
    Description: "GraphQL API Key for authentication"
    Value: !GetAtt GraphQLApiKey.ApiKey
    Export:
      Name: !Sub "${AWS::StackName}-GraphQLApiKey"

  GraphQLResolverFunctionArn:
    Description: "GraphQL Resolver Lambda function ARN"
    Value: !GetAtt GraphQLResolverFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-GraphQLResolverFunction"

  StreamProcessorFunctionArn:
    Description: "Stream Processor Lambda function ARN"
    Value: !GetAtt StreamProcessorFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-StreamProcessorFunction"

  # Data Outputs
  JobsTableName:
    Description: "DynamoDB table for job tracking"
    Value: !Ref JobsTable
    Export:
      Name: !Sub "${AWS::StackName}-JobsTable"

  JobsTableArn:
    Description: "DynamoDB table ARN"
    Value: !GetAtt JobsTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-JobsTableArn"

  JobsTableStreamArn:
    Description: "DynamoDB table stream ARN"
    Value: !GetAtt JobsTable.StreamArn
    Export:
      Name: !Sub "${AWS::StackName}-JobsTableStreamArn"

  S3BucketName:
    Description: "S3 bucket for pipeline data"
    Value: !Ref S3Bucket
    Export:
      Name: !Sub "${AWS::StackName}-S3Bucket"

  # Frontend Environment Variables
  FrontendConfig:
    Description: "Configuration values for React frontend"
    Value: !Sub |
      REACT_APP_GRAPHQL_URL=${GraphQLApi.GraphQLUrl}
      REACT_APP_GRAPHQL_API_KEY=${GraphQLApiKey.ApiKey}
      REACT_APP_REST_API_URL=https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}
      REACT_APP_AWS_REGION=${AWS::Region}
      REACT_APP_ENVIRONMENT=${EnvironmentName}
    Export:
      Name: !Sub "${AWS::StackName}-FrontendConfig"